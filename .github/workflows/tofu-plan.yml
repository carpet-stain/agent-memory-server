# Saved-plan-on-merge, plan side (ADR-0002 decision 4, copy-adapted from
# infra's tofu-plan.yml): plan every push to a terraform-touching PR, upload
# the plan as a tree-hash-keyed artifact (already encrypted at rest by
# TF_ENCRYPTION's `plan { enforced = true }`), and upsert the rendered plan
# as a PR comment. tofu-apply.yml consumes the artifact on merge.
name: Tofu Plan

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: ["main"]
    paths:
      - "**.tf"
      - "**/.terraform.lock.hcl"

concurrency:
  group: tofu-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    # Job-level `if:` — a skipped-via-if job reads as passing to
    # required-status-check branch protection, same gate as pr-guards.yml.
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Install tenv (pinned)
        env:
          TENV_VERSION: "4.14.8"
        run: |
          curl -fsSL "https://github.com/tofuutils/tenv/releases/download/v${TENV_VERSION}/tenv_v${TENV_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin tenv tofu

      - name: Assume agent-memory-plan-read (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: Read /cicd secrets
        id: ssm
        uses: ./.github/actions/read-ssm-params
        with:
          names: >-
            /cicd/agent-memory/neon-api-key
            /cicd/agent-memory/tf-state-passphrase
            /cicd/agent-memory/r2-plan-access-key-id
            /cicd/agent-memory/r2-plan-storage-token
            /cicd/agent-memory/r2-account-id

      # Plan-time google refresh federates through the read-only plan-read
      # WIF provider (infra#272) — never the deploy identity.
      - name: Authenticate to GCP (plan-read WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_PLAN_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SA_EMAIL }}

      - name: tofu init + plan
        id: plan
        env:
          TENV_AUTO_INSTALL: "true"
          TENV_GITHUB_TOKEN: ${{ github.token }}
          # Held but never exercised under -refresh=false: the provider's
          # NewClient rejects an empty key at configure time (sdk-go v0.16.0).
          NEON_API_KEY: ${{ steps.ssm.outputs.NEON_API_KEY }}
          TF_STATE_PASSPHRASE: ${{ steps.ssm.outputs.TF_STATE_PASSPHRASE }}
          R2_ACCESS_KEY_ID: ${{ steps.ssm.outputs.R2_PLAN_ACCESS_KEY_ID }}
          R2_STORAGE_TOKEN: ${{ steps.ssm.outputs.R2_PLAN_STORAGE_TOKEN }}
          R2_ACCOUNT_ID: ${{ steps.ssm.outputs.R2_ACCOUNT_ID }}
          TF_VAR_neon_org_id: ${{ vars.NEON_ORG_ID }}
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_container_image: ${{ vars.CONTAINER_IMAGE }}
          TF_VAR_ssm_read_role_arn: ${{ vars.SSM_READ_ROLE_ARN }}
        run: |
          # R2's S3 secret is sha256(token); creds ride a runner-local profile,
          # never raw backend-config keys — those embed in the plan (infra#164).
          r2_secret_key="$(printf '%s' "$R2_STORAGE_TOKEN" | shasum -a 256 | cut -d' ' -f1)"
          printf '[r2-backend]\naws_access_key_id = %s\naws_secret_access_key = %s\n' \
            "$R2_ACCESS_KEY_ID" "$r2_secret_key" >"$RUNNER_TEMP/r2-credentials"
          export AWS_SHARED_CREDENTIALS_FILE="$RUNNER_TEMP/r2-credentials"
          export AWS_ENDPOINT_URL_S3="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # shellcheck disable=SC2089,SC2090 # the quotes ARE the payload — HCL, not shell
          TF_ENCRYPTION='
          key_provider "pbkdf2" "state" {
            passphrase = "'"$TF_STATE_PASSPHRASE"'"
          }
          method "aes_gcm" "state" {
            keys = key_provider.pbkdf2.state
          }
          state {
            method   = method.aes_gcm.state
            enforced = true
          }
          plan {
            method   = method.aes_gcm.state
            enforced = true
          }'
          # shellcheck disable=SC2090
          export TF_ENCRYPTION

          tofu -chdir=terraform init -input=false
          # -lock=false: read-only plan-tier R2 token can't lock. -refresh=false: a PR
          # job must not exercise the Neon writer key (ADR-0029); drift watched on main.
          tofu -chdir=terraform plan -out=tfplan -input=false -lock=false -refresh=false
          # Same step as plan — TF_ENCRYPTION must be present to decrypt tfplan.
          tofu -chdir=terraform show -no-color tfplan >plan.txt
          echo "tree_sha=$(git rev-parse 'HEAD^{tree}')" >>"$GITHUB_OUTPUT"

      # Keyed by tree hash, not commit SHA (infra ADR-0007): rebase-merge
      # rewrites the SHA; the tree is what apply can re-derive.
      - uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ steps.plan.outputs.tree_sha }}
          path: terraform/tfplan
          retention-days: 7

      - name: Upsert plan comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TREE_SHA: ${{ steps.plan.outputs.tree_sha }}
        run: |
          marker='<!-- tofu-plan -->'
          body_file="$RUNNER_TEMP/plan-comment.md"
          {
            echo "$marker"
            echo "### \`tofu plan\` for \`${GITHUB_SHA}\` (tree \`${TREE_SHA}\`)"
            echo
            echo '```'
            cat plan.txt
            echo '```'
          } >"$body_file"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n1)"
          if [[ -n "$existing" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F body=@"$body_file" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@"$body_file" >/dev/null
          fi
