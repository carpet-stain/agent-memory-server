name: PR guards

# Enforces the one-commit-per-PR + rebase-merge workflow (AGENTS.md): a PR must
# be exactly one commit whose subject is a Conventional Commit, so rebase-merge
# lands a single clean, author-written commit on main; and it
# must close an issue or declare why not (dotfiles#449 — see that job's own
# comment).
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  single-commit:
    name: single commit
    runs-on: ubuntu-latest
    # Draft PRs open early and take WIP pushes; a skipped-via-if job reads as
    # passing to required-status-check branch protection, not failing, so
    # this stays quiet until ready_for_review re-triggers it for real.
    if: github.event.pull_request.draft == false
    steps:
      - name: Assert the PR is exactly one commit
        env:
          COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          if [ "$COMMITS" -ne 1 ]; then
            echo "::error::PR has $COMMITS commits; squash to exactly one before merge (git rebase origin/main && git reset --soft origin/main && git commit)."
            exit 1
          fi
          echo "PR is a single commit."

  conventional-commit:
    name: conventional commit
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # The commit that rebase-merges onto main is what git-cliff
      # reads for the changelog, so its subject must be a Conventional Commit.
      # Scope stays optional/unrestricted.
      - name: Validate Conventional Commit subject
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          rc=0
          for sha in $(git rev-list "$BASE"..HEAD); do
            subject=$(git log -1 --format=%s "$sha")
            if echo "$subject" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore)(\([a-z0-9._-]+\))?!?: .+'; then
              echo "ok: $subject"
            else
              echo "::error::not a Conventional Commit: $subject"
              rc=1
            fi
          done
          exit $rc

  issue-link:
    name: issue link
    runs-on: ubuntu-latest
    # release-prepare.yml's release/* PRs close no issue by design — exempted
    # here in-guard rather than having that workflow inject a No-Issue body
    # marker, so the whole contract stays in this one file (dotfiles#449).
    if: github.event.pull_request.draft == false && !startsWith(github.event.pull_request.head.ref, 'release/')
    steps:
      # closingIssuesReferences is GitHub's own computed field (dotfiles#449) —
      # not a body-text regex — so it reflects the link however it was made (a
      # closing keyword or a manual Development-panel link), and a typo'd
      # keyword that failed to actually link fails this check instead of
      # passing it.
      - name: Require a closing issue reference or a No-Issue marker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          # shellcheck disable=SC2016 # single-quoted: these are GraphQL's own
          # $owner/$repo/$number variables, passed via -f/-F below — must not
          # expand as bash variables.
          count=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  closingIssuesReferences { totalCount }
                }
              }
            }' -f owner="$OWNER" -f repo="$REPO" -F number="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.totalCount')

          if [ "$count" -gt 0 ]; then
            echo "closes $count issue(s) — ok."
            exit 0
          fi

          # GNU grep's \s/\S here, not dotfiles#449's original POSIX space
          # class: that class opens with two square brackets, which
          # collides with this template's own jinja variable delimiter
          # (copier.yml's _envops) and fails the render.
          if echo "$PR_BODY" | grep -qE '^No-Issue:\s*\S'; then
            echo "No-Issue marker present — ok."
            exit 0
          fi

          echo "::error::PR closes no issue and has no No-Issue: marker. Add \`Closes #N\` to the body, or a \`No-Issue: <reason>\` line."
          exit 1
