# Saved-plan-on-merge, apply side (ADR-0002 decision 4): consume the exact
# plan artifact the PR reviewed — no re-plan, no drift window, no
# `environment:` gate (PR review + protected main is the checkpoint). A
# missing artifact hard-fails; tofu-apply-dispatch.yml is the escape hatch.
name: Tofu Apply

on:
  push:
    branches: ["main"]
    paths:
      - "**.tf"
      - "**/.terraform.lock.hcl"

# Applies queue; never cancel a state-writing run.
concurrency:
  group: tofu-apply-main
  cancel-in-progress: false

jobs:
  apply:
    name: apply
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Locate and download the saved plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          artifact="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=tfplan-${tree_sha}&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0] // empty')"
          if [[ -z "$artifact" ]]; then
            echo "::error::No plan artifact for tree ${tree_sha} — the merged tree never got a PR plan (base moved between plan and merge?). Run tofu-apply-dispatch.yml."
            exit 1
          fi
          run_id="$(jq -r '.workflow_run.id' <<<"$artifact")"
          gh run download "$run_id" --name "tfplan-${tree_sha}" --dir terraform

      - name: Install tenv (pinned)
        env:
          TENV_VERSION: "4.14.8"
        run: |
          curl -fsSL "https://github.com/tofuutils/tenv/releases/download/v${TENV_VERSION}/tenv_v${TENV_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin tenv tofu

      - name: Assume agent-memory-apply (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Read /cicd secrets
        id: ssm
        uses: ./.github/actions/read-ssm-params
        with:
          names: >-
            /cicd/agent-memory/neon-api-key
            /cicd/agent-memory/tf-state-passphrase
            /cicd/agent-memory/r2-apply-access-key-id
            /cicd/agent-memory/r2-apply-storage-token
            /cicd/agent-memory/r2-account-id

      # Apply reuses the deploy identity (run.developer) — infra#272 decision 4.
      - name: Authenticate to GCP (deploy WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_DEPLOY_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA_EMAIL }}

      # One step: tofu output needs the same TF_ENCRYPTION/backend env as
      # apply, and env dies with the step.
      - name: tofu apply + post-apply migration
        env:
          TENV_AUTO_INSTALL: "true"
          NEON_API_KEY: ${{ steps.ssm.outputs.NEON_API_KEY }}
          TF_STATE_PASSPHRASE: ${{ steps.ssm.outputs.TF_STATE_PASSPHRASE }}
          R2_ACCESS_KEY_ID: ${{ steps.ssm.outputs.R2_APPLY_ACCESS_KEY_ID }}
          R2_STORAGE_TOKEN: ${{ steps.ssm.outputs.R2_APPLY_STORAGE_TOKEN }}
          R2_ACCOUNT_ID: ${{ steps.ssm.outputs.R2_ACCOUNT_ID }}
          TF_VAR_neon_org_id: ${{ vars.NEON_ORG_ID }}
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_container_image: ${{ vars.CONTAINER_IMAGE }}
          TF_VAR_ssm_read_role_arn: ${{ vars.SSM_READ_ROLE_ARN }}
        run: |
          r2_secret_key="$(printf '%s' "$R2_STORAGE_TOKEN" | shasum -a 256 | cut -d' ' -f1)"
          printf '[r2-backend]\naws_access_key_id = %s\naws_secret_access_key = %s\n' \
            "$R2_ACCESS_KEY_ID" "$r2_secret_key" >"$RUNNER_TEMP/r2-credentials"
          export AWS_SHARED_CREDENTIALS_FILE="$RUNNER_TEMP/r2-credentials"
          export AWS_ENDPOINT_URL_S3="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # shellcheck disable=SC2089,SC2090 # the quotes ARE the payload — HCL, not shell
          TF_ENCRYPTION='
          key_provider "pbkdf2" "state" {
            passphrase = "'"$TF_STATE_PASSPHRASE"'"
          }
          method "aes_gcm" "state" {
            keys = key_provider.pbkdf2.state
          }
          state {
            method   = method.aes_gcm.state
            enforced = true
          }
          plan {
            method   = method.aes_gcm.state
            enforced = true
          }'
          # shellcheck disable=SC2090
          export TF_ENCRYPTION

          tofu -chdir=terraform init -input=false
          tofu -chdir=terraform apply -input=false tfplan

          # Post-apply migration as owner — Neon's admin lacks ADMIN OPTION on
          # API-created roles; privileges not membership (ADR-0002 decision 5).
          owner_uri="$(tofu -chdir=terraform output -raw neon_owner_connection_uri)"
          echo "::add-mask::$owner_uri"
          app="$(tofu -chdir=terraform output -json neon_role_names | jq -r '.app')"
          psql "$owner_uri" -v ON_ERROR_STOP=1 \
            -f src/db/schema.sql \
            -c "GRANT USAGE ON SCHEMA public TO \"${app}\";" \
            -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO \"${app}\";" \
            -c "ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO \"${app}\";"
